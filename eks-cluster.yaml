apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: blog-cluster
  region: ap-south-1
  version: "1.31"

iam:
  withOIDC: true

vpc:
  id: "vpc-02268ba868f2a9357"

  subnets:
    public:
      ap-south-1a:
        id: "subnet-02fd8fb376c9b8d15"
      ap-south-1b:
        id: "subnet-07d5d35797b544267"
      ap-south-1c:
        id: "subnet-0bba3892400d773d1"

    private:
      ap-south-1a:
        id: "subnet-0ed3cab731dc9ba21"
      ap-south-1b:
        id: "subnet-00328ee66f7533a54"
      ap-south-1c:
        id: "subnet-0d5b161d3ce6e3904"

managedNodeGroups:
  - name: blog-workers
    instanceType: t3.small
    minSize: 2
    maxSize: 3
    desiredCapacity: 2
    volumeSize: 20
    amiFamily: AmazonLinux2023
    privateNetworking: false

    iam:
      withAddonPolicies:
        autoScaler: true
        albIngress: true
        cloudWatch: true

addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy

cloudWatch:
  clusterLogging:
    enableTypes:
      - api
      - audit
      - authenticator